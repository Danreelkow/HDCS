reg: {domain: cs-programming, canon: "bash/systemd/r identifiers: rsync --delete, OnCalendar=, systemctl --user, set -euo pipefail, trap, env defaults :="}
intent: >
  standing-sync := rsync-first mirror SRC -> DST, user-level timer every 6h;
  deliverable := artifact dir containing sync-hermes-context.sh, hermes-context.service,
  hermes-context.timer, README.md;
  forall path (rsync or cp-fallback) -> DST == SRC recursively (I2/I3);
  --dry-run -> zero writes (I4); no root for any install (I5/UNITS)
must_keep:
  - "source path is /opt/data/workspace/hermes-context/"
  - "dry-run mode that performs no writes"
  - "systemd user units, no root required"
resolved:
  - "Q1: canonical SRC/DST? -> A: SRC=/opt/data/workspace/hermes-context/ (host mount), DST=/workspace/hermes-context/ exists w/ INDEX.md, agents/, config/ (A1)"
  - "Q2: direction? -> A: one-way host -> workspace, nothing writes back (A2)"
  - "Q3: systemd class? -> A: user-level systemctl --user; script standalone if no systemd (A3)"
  - "Q4: rsync availability? -> A: detect absence, fall back to cp -a/tar-pipe; sync CONTENTS (SRC/ -> DST), never nest (A4)"
  - "Q5: stale-file policy? -> A: exact mirror, stale DELETED, both paths converge identically (A5)"
  - "Q6: dry-run logging? -> A: zero writes of any kind incl. logs; DST byte-identical post dry-run (A6)"
  - "Q7: mirror depth? -> A: recursive convergence, stale subtrees deleted for all depth, README states correctly (A7)"
  - "Q8: log/install placement? -> A: LOG never in DST (~/.cache default); entrypoints in ~/.local/bin or /workspace/hdcs/bin, never inside mirrored tree (A8)"
  - "Q9: remaining ambiguities? -> A: none; A1-A8 resolve all open questions; no OPEN items"
workflow: {phases: [plan, scoped-build, verify, deliver], builders: dynamic, verifier: decorrelated, gate: READY|NOT_READY, max_fix_cycles: 2}
handoff:
  state: S_0 + Delta -> S_1
  report: [+done, -resolved, +open, +validation]
constraints:
  - "MUST_KEEP verbatim: /opt/data/workspace/hermes-context/ as SRC default (I8)"
  - "no_resurrect: I4 dry-run purity; I6 placement law (no LOG/entrypoint inside DST, no post-mirror rewrite exceptions)"
  - "I2/I3: rsync --delete semantics; cp fallback reconciles recursively, byte-identical convergence"
  - "I5: rsync-absence detection + fallback; script standalone-capable"
  - "no root anywhere: user units, user-writable install paths only"
  - "I7 idempotency; I9 one summary line per real run"
paths:
  - "[artifact_dir]/sync-hermes-context.sh"
  - "[artifact_dir]/hermes-context.service"
  - "[artifact_dir]/hermes-context.timer"
  - "[artifact_dir]/README.md"
  - "~/.local/bin/sync-hermes-context.sh (install target)"
  - "~/.config/systemd/user/hermes-context.service (install target)"
  - "~/.config/systemd/user/hermes-context.timer (install target)"
  - "~/.cache/hermes-context/sync.log (LOG, outside DST)"
budgets: {tokens: estimate, lines: 60, fix_cycles: 2, questions: 2}