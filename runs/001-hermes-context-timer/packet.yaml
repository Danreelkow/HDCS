reg: {domain: cs-programming, canon: shell/systemd ops vocabulary — rsync/cp flags, systemctl --user unit grammar, exit codes, env var defaults}
intent: build artifact dir {sync-hermes-context.sh, hermes-context.service, hermes-context.timer, README.md} implementing standing 6h user-level mirror SRC -> DST per invariants A2,A4-A9,A11; script standalone-capable on systemd-less hosts (A3)
must_keep:
  - source path is /opt/data/workspace/hermes-context/
  - dry-run mode that performs no writes
  - systemd user units, no root required
resolved:
  - "Q1: canonical SRC/DST? -> A: A1 — SRC=/opt/data/workspace/hermes-context/ (host mount), DST=/workspace/hermes-context/ (exists, holds INDEX.md, agents/, config/)"
  - "Q2: sync direction? -> A: A2 — one-way host -> workspace, no write-back to SRC"
  - "Q3: scheduling mechanism? -> A: A3 — systemctl --user timer, 6h; script must run standalone w/o systemd"
  - "Q4: rsync absence? -> A: A4 — detect, fall back to cp -a; sync CONTENTS of SRC into DST, never nest"
  - "Q5: stale file policy? -> A: A5 — exact mirror, --delete on rsync path, cp fallback reconciles identically"
  - "Q6: dry-run logging? -> A: A6 — zero writes incl. logs; DST byte-identical pre/post dry-run"
  - "Q7: fallback reconciliation depth? -> A: A7 — recursive, stale subtrees deleted ∀ depth"
  - "Q8: log/install placement? -> A: A8 — log in ~/.cache (never DST), entrypoints in ~/.local/bin or /workspace/hdcs/bin (never mirrored tree)"
  - "Q9: mirror definition scope? -> A: A9 — contents+structure+symlinks recursive only; verify FAILs nonzero on mismatch"
  - "Q10: severity bar? -> A: A10 — FAIL only on normal-operation defects; exotic -> KNOWN_LIMITATIONS in +open"
  - "Q11: destructive misconfig? -> A: A11 — guard SRC==DST, never rm -rf DST pre-verified-copy"
workflow: {phases: [plan, scoped-build, verify, deliver], builders: dynamic, verifier: decorrelated, gate: READY|NOT_READY, max_fix_cycles: 2}
handoff: {state: S_0 + Delta -> S_1, report: [+done, -resolved, +open, +validation]}
constraints:
  - invariant A6_dryrun: --dry-run => ∀ write targets suppressed, log incl.
  - invariant A9_class: self-verification enforces exact equivalence class, nonzero exit on mismatch
  - invariant A11_guard: source survival outranks mirror freshness
  - no_resurrect: S4 verdicts A5,A6,A7,A8,A9,A10,A11 — re-introduction of accumulate-only fallback, dry-run logging, non-recursive reconciliation, DST-placed artifacts, warn-and-exit-0 verification, or dst-destructive-before-copy => defect
paths:
